<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lateral Gang 🎉 | Yaadein, Masti, Dosti</title>
<meta name="description" content="Lateral Gang — 6 lateral-entry doston ki yaadon ka ghar. Photos, videos, trips aur funny moments, sab ek jagah!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff4d8d; --yellow:#ffd93d; --cyan:#4dd8ff; --purple:#9b5de5;
  --green:#5ee87a; --orange:#ff9f45; --red:#ff5d5d; --ink:#232323;
  --bg1:#fff7e6; --bg2:#ffe9f3; --bg3:#e6f4ff;
  --card:#ffffff; --radius:20px;
  --shadow:5px 5px 0 rgba(35,35,35,.9);
  --shadow-sm:3px 3px 0 rgba(35,35,35,.9);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Fredoka','Hind',system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3));
  background-attachment:fixed; min-height:100vh; padding-bottom:90px;
}
::selection{background:var(--yellow)}
a{color:inherit}
/* ---------- NAV ---------- */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:3px solid var(--ink);
}
.nav-inner{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:1.35rem;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:6px}
.logo .lg-badge{background:var(--ink);color:#fff;border-radius:12px;padding:2px 10px;font-size:.95rem}
.nav-links{display:flex;gap:8px;overflow-x:auto;margin-left:auto;padding:4px 2px;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  text-decoration:none;font-weight:600;font-size:.92rem;white-space:nowrap;
  padding:8px 14px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;
  box-shadow:var(--shadow-sm);transition:transform .12s;
}
.nav-links a:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(35,35,35,.9)}
.nav-links a.active{background:var(--yellow)}
/* ---------- LAYOUT ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px}
.page-title{font-size:1.7rem;font-weight:700;margin:6px 0 2px}
.page-sub{opacity:.75;margin-bottom:16px;font-weight:500}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.btn{
  font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
  border:3px solid var(--ink);border-radius:14px;padding:10px 18px;background:#fff;
  box-shadow:var(--shadow-sm);transition:transform .12s;text-decoration:none;display:inline-block;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(35,35,35,.9)}
.btn.primary{background:var(--yellow)}
.btn.pink{background:var(--pink);color:#fff}
.btn.cyan{background:var(--cyan)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ---------- HERO ---------- */
.hero{
  background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:var(--shadow);
  padding:34px 22px;text-align:center;position:relative;overflow:hidden;margin-bottom:22px;
}
.hero::before{content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 12% 18%, var(--yellow) 0 46px, transparent 47px),
    radial-gradient(circle at 88% 12%, var(--pink) 0 38px, transparent 39px),
    radial-gradient(circle at 82% 88%, var(--cyan) 0 52px, transparent 53px),
    radial-gradient(circle at 8% 82%, var(--green) 0 34px, transparent 35px);
  opacity:.5;pointer-events:none}
.hero h1{font-size:2.4rem;font-weight:700;position:relative}
.hero h1 .stroke{background:linear-gradient(180deg,transparent 62%,var(--yellow) 62%)}
.tagline{font-family:'Hind',sans-serif;font-size:1.35rem;font-weight:700;color:var(--pink);margin:10px 0;position:relative}
.hero p{position:relative;font-weight:500;opacity:.85;max-width:560px;margin:0 auto 18px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative}
.stat{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--shadow-sm);padding:10px 20px;min-width:110px}
.stat b{font-size:1.5rem;display:block}
.stat span{font-size:.85rem;opacity:.7;font-weight:600}
/* ---------- GRID / CARDS ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.mcard{
  background:var(--card);border:3px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:transform .15s;position:relative;
}
.mcard:hover{transform:translateY(-3px)}
.mcard .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:linear-gradient(135deg,var(--bg2),var(--bg3))}
.mcard video.thumb{background:#111}
.mcard .meta{padding:10px 12px}
.mcard .cap{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .sub{font-size:.78rem;opacity:.65;font-weight:500;margin-top:2px}
.vid-badge{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-size:.75rem;font-weight:700;
  padding:4px 10px;border-radius:999px;border:2px solid #fff}
.del-btn{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border:2.5px solid var(--ink);
  border-radius:12px;font-weight:700;font-size:.8rem;padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 rgba(35,35,35,.9)}
.empty{
  text-align:center;padding:46px 20px;background:#fff;border:3px dashed var(--ink);border-radius:24px;font-weight:600;
}
.empty .big{font-size:2.6rem;display:block;margin-bottom:8px}
/* ---------- MEMBERS ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.member-card{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow-sm);
  padding:20px 12px;text-align:center;cursor:pointer;transition:transform .15s;text-decoration:none}
.member-card:hover{transform:translateY(-3px) rotate(-1deg)}
.avatar{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;color:#fff}
.member-card h3{font-size:1.05rem}
.member-card .nick{display:inline-block;margin-top:6px;background:var(--yellow);border:2.5px solid var(--ink);
  border-radius:999px;padding:2px 12px;font-weight:700;font-size:.85rem}
.member-card .count{font-size:.78rem;opacity:.6;font-weight:600;margin-top:6px;display:block}
/* ---------- BIRTHDAYS ---------- */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.bcard{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow-sm);
  padding:20px 12px;text-align:center;position:relative;overflow:hidden}
.bcard .cake{font-size:2.4rem}
.bcard h3{margin:8px 0 2px}
.bcard .date{font-weight:700;color:var(--pink)}
.bcard .countdown{display:inline-block;margin-top:8px;background:var(--cyan);border:2.5px solid var(--ink);
  border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700}
.bcard.soon{opacity:.75;background:repeating-linear-gradient(45deg,#fff,#fff 12px,#fdf3ff 12px,#fdf3ff 24px)}
/* ---------- TRIPS ---------- */
.trip-sec{margin-bottom:26px}
.trip-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.trip-head h2{font-size:1.3rem}
.trip-head .pill{background:var(--purple);color:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:3px 14px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow-sm)}
/* ---------- LIGHTBOX ---------- */
.lb{position:fixed;inset:0;z-index:100;background:rgba(20,20,30,.82);display:none;
  align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.lb.open{display:flex}
.lb-box{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:var(--shadow);
  max-width:640px;width:100%;max-height:92vh;overflow-y:auto;padding:16px;position:relative}
.lb-media{width:100%;border-radius:16px;border:2.5px solid var(--ink);max-height:52vh;object-fit:contain;background:#111;display:block}
.lb-close{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;border:2.5px solid var(--ink);
  width:38px;height:38px;border-radius:50%;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);z-index:2}
.lb-cap{font-weight:700;font-size:1.05rem;margin:12px 0 4px}
.lb-info{font-size:.85rem;opacity:.7;font-weight:500;margin-bottom:8px}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tag{background:var(--bg3);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700}
.reacts{display:flex;gap:10px;margin:12px 0}
.react{flex:1;border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:1.25rem;padding:8px;
  cursor:pointer;box-shadow:var(--shadow-sm);font-family:inherit;transition:transform .1s}
.react:active{transform:scale(.93)}
.react b{display:block;font-size:.85rem}
.react.done{background:var(--yellow)}
.lb-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
/* ---------- UPLOAD ---------- */
.up-card{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.up-card h2{margin-bottom:4px}
.up-card .hint{font-size:.88rem;opacity:.7;font-weight:500;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:.95rem}
.field input[type=text],.field input[type=date],.field select{
  width:100%;font-family:inherit;font-size:1rem;font-weight:500;padding:11px 14px;
  border:3px solid var(--ink);border-radius:14px;background:#fffdf5;outline:none;
}
.field input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,77,141,.2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2.5px solid var(--ink);border-radius:999px;padding:7px 15px;font-weight:700;font-size:.88rem;
  background:#fff;cursor:pointer;box-shadow:2px 2px 0 rgba(35,35,35,.9);font-family:inherit;transition:transform .1s}
.chip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(35,35,35,.9)}
.chip.on{background:var(--green)}
.chip.uploader.on{background:var(--cyan)}
.drop{border:3px dashed var(--ink);border-radius:18px;padding:30px 16px;text-align:center;cursor:pointer;
  background:#fffdf5;font-weight:600;transition:background .15s}
.drop:hover{background:#fff3d6}
.drop input{display:none}
.filelist{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.filerow{background:#fffdf5;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:.88rem;font-weight:600}
.filerow .bar{height:10px;background:#eee;border:2px solid var(--ink);border-radius:99px;margin-top:8px;overflow:hidden}
.filerow .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .2s}
.filerow .st{font-size:.78rem;opacity:.7}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:11px;border:3px solid var(--ink);border-radius:14px;font-weight:700;cursor:pointer;background:#fff;box-shadow:var(--shadow-sm);font-family:inherit;font-size:.92rem}
.tab.on{background:var(--pink);color:#fff}
/* ---------- ADMIN ---------- */
.trashrow{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:10px;box-shadow:var(--shadow-sm);margin-bottom:10px}
.trashrow img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:2px solid var(--ink)}
.trashrow .tmeta{flex:1;font-size:.88rem;font-weight:600}
.trashrow .tmeta small{opacity:.6;font-weight:500;display:block}
/* ---------- TOAST ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);z-index:200;
  background:var(--ink);color:#fff;font-weight:700;padding:13px 24px;border-radius:999px;border:3px solid #fff;
  box-shadow:0 6px 24px rgba(0,0,0,.3);transition:transform .3s;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
/* ---------- MISC ---------- */
.secret-note{background:#fff8e1;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;font-weight:600;
  font-size:.9rem;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.kbd{background:var(--ink);color:#fff;border-radius:8px;padding:2px 10px;font-size:.85rem;font-weight:700}
footer{text-align:center;margin-top:34px;font-weight:600;opacity:.65;font-size:.88rem}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(0,0,0,.2);border-top-color:var(--ink);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a class="logo" href="#/">🎉 <span class="lg-badge">Lateral Gang</span></a>
  <div class="nav-links" id="navLinks"></div>
</div></nav>
<div class="wrap" id="app"></div>
<div class="lb" id="lightbox"><div class="lb-box" id="lbBox"></div></div>
<div class="toast" id="toast"></div>
<footer>Made with ❤️ by Danish &amp; naaz · Lateral Gang · देर से आए, मगर दुरुस्त आए।</footer>
<script>

/* ================= CONFIG ================= */
const CONFIG = {
  cloudName: 'bzrrwgf5',
  uploadPreset: 'lateral-gang',
  supabaseUrl: 'https://voaxmnpkckdvkxigtpnb.supabase.co',
  supabaseKey: 'sb_publishable_6_Gl5ApTlqOSNb7N2b9ifg_K-mw98yO'
};

const MEMBERS = [
  {name:'Danish',    nick:'Admin 😎', tag:'danish', color:'#ff4d8d', emoji:'😎'},
  {name:'Divyanshu', nick:'Divya',    tag:'divya',  color:'#9b5de5', emoji:'🌟'},
  {name:'Jai Prakash',nick:'JP',      tag:'jp',     color:'#4dd8ff', emoji:'⚡'},
  {name:'Sarthak',   nick:'Mota',     tag:'mota',   color:'#ff9f45', emoji:'🐼'},
  {name:'Harish',    nick:'Bona',     tag:'bona',   color:'#5ee87a', emoji:'🔥'},
  {name:'Kuldeep',   nick:'Paaji',    tag:'paaji',  color:'#ffd93d', emoji:'👑'},
];
const FOLDERS = [...MEMBERS.map(m=>({tag:m.tag,label:m.nick})), {tag:'group',label:'Group 👥'}];
const BIRTHDAYS = [
  {name:'Danish',nick:'Admin 😎',emoji:'😎',day:14,month:1},
  {name:'Divyanshu',nick:'Divya',emoji:'🌟',day:28,month:7},
  {name:'Harish',nick:'Bona',emoji:'🔥',day:21,month:5},
  {name:'Jai Prakash',nick:'JP',emoji:'⚡'},
  {name:'Sarthak',nick:'Mota',emoji:'🐼'},
  {name:'Kuldeep',nick:'Paaji',emoji:'👑'},
];
const NAV = [
  {r:'#/',label:'🏠 Home'},{r:'#/photos',label:'📸 Photos'},{r:'#/videos',label:'🎬 Videos'},
  {r:'#/trips',label:'🧳 Trips'},{r:'#/funny',label:'😂 Funny'},{r:'#/members',label:'👥 Members'},
  {r:'#/birthdays',label:'🎂 Birthdays'},{r:'#/upload',label:'📤 Upload'},
];

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
function toast(msg,ms=2600){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(dstr){
  if(!dstr) return '';
  const d=new Date(dstr.length<=10? dstr+'T00:00:00' : dstr);
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function isAdmin(){ return sessionStorage.getItem('lg_admin')==='1'; }
function memberByTag(tag){ return MEMBERS.find(m=>m.tag===tag); }
function driveId(url){
  const m=String(url).match(/\/d\/([a-zA-Z0-9_-]+)/) || String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m?m[1]:null;
}
function isDrive(row){ return /drive\.google\.com/.test(row.url||''); }
function playUrl(row){
  if(isDrive(row)){ const id=driveId(row.url); return id?`https://drive.google.com/file/d/${id}/preview`:row.url; }
  return row.url;
}
function downloadUrl(row){
  if(isDrive(row)){ const id=driveId(row.url); return id?`https://drive.google.com/uc?export=download&id=${id}`:row.url; }
  try{
    const u=new URL(row.url);
    if(u.hostname.includes('cloudinary.com')){
      const parts=u.pathname.split('/upload/');
      if(parts.length===2) return parts[0]+'/upload/fl_attachment/'+parts[1];
    }
  }catch(e){}
  return row.url;
}
function thumbUrl(row){
  if(row.type==='photo') return row.url;
  if(isDrive(row)) return null;
  try{
    const u=new URL(row.url);
    if(u.hostname.includes('cloudinary.com')){
      const parts=u.pathname.split('/upload/');
      if(parts.length===2) return parts[0]+'/upload/so_auto,w_640/'+parts[1].replace(/\.[a-z0-9]+$/i,'.jpg');
    }
  }catch(e){}
  return null;
}

/* ================= SUPABASE REST ================= */
const SB = {
  h(extra={}){
    return Object.assign({
      'apikey':CONFIG.supabaseKey,
      'Authorization':'Bearer '+CONFIG.supabaseKey,
      'Content-Type':'application/json'
    },extra);
  },
  async list(){
    const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/media?select=*&trashed=eq.false&order=created_at.desc&limit=2000`,{headers:this.h()});
    if(!r.ok) throw new Error('load fail');
    return r.json();
  },
  async trash(){
    const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/media?select=*&trashed=eq.true&order=created_at.desc`,{headers:this.h()});
    return r.json();
  },
  async insert(row){
    const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/media`,{method:'POST',headers:this.h({'Prefer':'return=representation'}),body:JSON.stringify(row)});
    if(!r.ok) throw new Error('save fail');
    return r.json();
  },
  async patch(id,patch){
    const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/media?id=eq.${id}`,{method:'PATCH',headers:this.h({'Prefer':'return=representation'}),body:JSON.stringify(patch)});
    if(!r.ok) throw new Error('update fail');
    return r.json();
  },
  async del(id){
    const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/media?id=eq.${id}`,{method:'DELETE',headers:this.h()});
    if(!r.ok) throw new Error('delete fail');
  }
};

/* ================= CLOUDINARY UPLOAD (with progress) ================= */
function uploadToCloudinary(file,onProgress){
  return new Promise((resolve,reject)=>{
    const resourceType = file.type.startsWith('video') ? 'video' : 'image';
    const fd=new FormData();
    fd.append('file',file);
    fd.append('upload_preset',CONFIG.uploadPreset);
    const xhr=new XMLHttpRequest();
    xhr.open('POST',`https://api.cloudinary.com/v1_1/${CONFIG.cloudName}/${resourceType}/upload`);
    xhr.upload.onprogress=e=>{ if(e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload=()=>{ try{ const j=JSON.parse(xhr.responseText); j.error?reject(new Error(j.error.message)):resolve(j); }catch(e){reject(e)} };
    xhr.onerror=()=>reject(new Error('network'));
    xhr.send(fd);
  });
}

/* ================= STATE ================= */
let ITEMS=[]; let sortOrder='new'; let curFolder=null;

/* ================= ROUTER ================= */
function parseHash(){
  const h=location.hash||'#/';
  const [pathQ]=[h.slice(1)];
  const [path,qs]=pathQ.split('?');
  return {path, params:new URLSearchParams(qs||'')};
}
window.addEventListener('hashchange',route);
function setNav(path){
  $('#navLinks').innerHTML=NAV.map(n=>{
    const p=n.r.slice(1)||'/';
    const active=(path===p)||(p!=='/'&&path.startsWith(p+'/'));
    return `<a href="${n.r}" class="${active?'active':''}">${n.label}</a>`;
  }).join('');
}
async function route(){
  const {path,params}=parseHash();
  setNav(path);
  window.scrollTo(0,0);
  if(path==='/upload') return renderUpload(params.get('folder'));
  if(path==='/admin') return renderAdmin();
  if(path.startsWith('/folder/')) return renderFolder(path.split('/')[2]);
  if(path==='/photos') return renderGallery('photo');
  if(path==='/videos') return renderGallery('video');
  if(path==='/trips') return renderTrips();
  if(path==='/funny') return renderFunny();
  if(path==='/members') return renderMembers();
  if(path==='/birthdays') return renderBirthdays();
  return renderHome();
}

/* ================= DATA ================= */
async function loadItems(force){
  if(ITEMS.length&&!force) return ITEMS;
  ITEMS=await SB.list();
  return ITEMS;
}
function sortItems(list){
  const k=r=>new Date(r.taken_date||r.created_at).getTime();
  return [...list].sort((a,b)=> sortOrder==='new'? k(b)-k(a) : k(a)-k(b));
}
function sortBar(){
  return `<div class="toolbar">
    <span style="font-weight:700">Sort:</span>
    <button class="btn ${sortOrder==='new'?'primary':''}" style="padding:7px 14px" onclick="setSort('new')">🆕 Naya pehle</button>
    <button class="btn ${sortOrder==='old'?'primary':''}" style="padding:7px 14px" onclick="setSort('old')">🕰️ Purana pehle</button>
  </div>`;
}
function setSort(o){ sortOrder=o; route(); }

/* ================= CARDS ================= */
function cardHTML(r){
  const up=esc(r.uploader||'');
  const adm=isAdmin()?`<button class="del-btn" onclick="event.stopPropagation();askDelete('${r.id}')">🗑️</button>`:'';
  const badge=r.type==='video'?'<span class="vid-badge">▶ VIDEO</span>':'';
  let media;
  if(r.type==='video'){
    const th=thumbUrl(r);
    media=th?`<img class="thumb" loading="lazy" src="${esc(th)}" alt="">`
            :`<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:3rem">🎬</div>`;
  }else media=`<img class="thumb" loading="lazy" src="${esc(r.url)}" alt="${esc(r.caption||'photo')}">`;
  return `<div class="mcard" onclick="openLB('${r.id}')">
    ${badge}${adm}${media}
    <div class="meta"><div class="cap">${esc(r.caption)||'📷 Yaad'}</div>
    <div class="sub">${up?up+' · ':''}${fmtDate(r.taken_date||r.created_at)}</div></div>
  </div>`;
}
function gridHTML(list){
  if(!list.length) return `<div class="empty"><span class="big">📭</span>Abhi kuch nahi hai yahan...<br>pehli yaad ka intezaar hai! ✨</div>`;
  return `<div class="grid">${sortItems(list).map(cardHTML).join('')}</div>`;
}

async function renderFunny(){

function renderBirthdays(){
  const now=new Date();
  const cards=BIRTHDAYS.map(b=>{
    if(!b.day) return `<div class="bcard soon"><div class="cake">${b.emoji}</div>
      <h3>${esc(b.name)}</h3><div class="nick" style="font-weight:700">${esc(b.nick)}</div>
      <div class="countdown">🎂 Date jald aayegi!</div></div>`;
    let next=new Date(now.getFullYear(),b.month-1,b.day);
    if(next<now) next=new Date(now.getFullYear()+1,b.month-1,b.day);
    const days=Math.ceil((next-now)/86400000);
    return `<div class="bcard"><div class="cake">🎂</div>
      <div style="font-size:2rem">${b.emoji}</div><h3>${esc(b.name)}</h3>

  }).join('');
  app.innerHTML=`<h1 class="page-title">🎂 Birthdays</h1>
    <div class="page-sub">Doston ke special din — miss mat karna!</div>
    <div class="bgrid">${cards}</div>`;

/* ================= LIGHTBOX ================= */
function openLB(id){
  const r=ITEMS.find(x=>x.id===id); if(!r) return;
  const tags=(r.tags||[]).filter(t=>!t.startsWith('trip:')&&t!=='funny').map(t=>{
    const f=FOLDERS.find(x=>x.tag===t);
    return `<span class="tag">${f?esc(f.label):esc(t)}</span>`;
  }).join('');
  const trips=(r.tags||[]).filter(t=>t.startsWith('trip:')).map(t=>`<span class="tag">🧳 ${esc(t.slice(5))}</span>`).join('');
  const funny=(r.tags||[]).includes('funny')?'<span class="tag">😂 Funny moment</span>':'';
  const media = r.type==='video'
    ? (isDrive(r)
        ? `<iframe class="lb-media" style="height:300px" src="${esc(playUrl(r))}" allow="autoplay;fullscreen" allowfullscreen></iframe>`
        : `<video class="lb-media" src="${esc(playUrl(r))}" controls playsinline preload="metadata"></video>`)
    : `<img class="lb-media" src="${esc(r.url)}" alt="">`;
  const rk=k=>`lg_reacted_${r.id}_${k}`;
  const reacted=k=>localStorage.getItem(rk(k))==='1';
  $('#lbBox').innerHTML=`<button class="lb-close" onclick="closeLB()">✕</button>${media}
    <div class="lb-cap">${esc(r.caption)||'📷 Yaad'}</div>
    <div class="lb-info">👤 ${esc(r.uploader||'')} · 📅 ${fmtDate(r.taken_date||r.created_at)}</div>
    <div class="tagrow">${tags}${trips}${funny}</div>
    <div class="reacts">
      ${[['laugh','😂','Haha'],['love','❤️','Love'],['fire','🔥','Lit']].map(([k,e,l])=>`
        <button class="react ${reacted(k)?'done':''}" onclick="react('${r.id}','${k}')">${e}<b>${(r.reactions||{})[k]||0} ${l}</b></button>`).join('')}
    </div>
    <div class="lb-actions">
      <a class="btn green" href="${esc(downloadUrl(r))}" download target="_blank" rel="noopener">⬇️ Original Download</a>
      ${isAdmin()?`<button class="btn" style="background:var(--red);color:#fff" onclick="askDelete('${r.id}')">🗑️ Delete</button>`:''}
    </div>`;
  $('#lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLB(){ $('#lightbox').classList.remove('open'); document.body.style.overflow=''; }
$('#lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') closeLB(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLB(); });
async function react(id,key){
  const r=ITEMS.find(x=>x.id===id); if(!r) return;
  const rk=`lg_reacted_${id}_${key}`;
  if(localStorage.getItem(rk)==='1'){ toast('Ek baar react kar diya! 😄'); return; }
  const cur=Object.assign({laugh:0,love:0,fire:0},r.reactions||{});
  cur[key]=(cur[key]||0)+1;
  try{
    const [u]=await SB.patch(id,{reactions:cur});
    r.reactions=u.reactions; localStorage.setItem(rk,'1'); openLB(id);
  }catch(e){ toast('Oops, try again! 😅'); }
}

/* ================= DELETE / TRASH ================= */
function askDelete(id){
  if(!confirm('Pakka delete karna hai? Ye pehle Trash me jayega. 🗑️')) return;
  doDelete(id);
}
async function doDelete(id){
  try{
    await SB.patch(id,{trashed:true});
    ITEMS=ITEMS.filter(x=>x.id!==id);
    closeLB(); toast('Trash me bhej diya! 🗑️'); route();
  }catch(e){ toast('Delete nahi ho paya 😅'); }
}
async function restoreItem(id){
  try{ await SB.patch(id,{trashed:false}); toast('Wapas aa gaya! 🎉'); renderAdmin(); }
  catch(e){ toast('Oops, try again! 😅'); }
}
async function permDelete(id,row){
  if(!confirm('PERMANENT delete? Ye wapas nahi aayega! ⚠️')) return;
  toast('Deleting... <span class="spin"></span>');
  try{
    if(row && row.delete_token && !isDrive(row)){
      try{
        const fd=new FormData(); fd.append('token',row.delete_token);
        await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudName}/delete_by_token`,{method:'POST',body:fd});
      }catch(e){/* token expired (>10 min) — file Cloudinary me reh sakti hai */}
    }
    await SB.del(id);
    toast('Permanent delete ho gaya! ✅'); renderAdmin();
  }catch(e){ toast('Delete nahi ho paya 😅'); }
}

/* ================= SECRET UPLOAD PAGE ================= */
let upState={tab:'direct',files:[],uploader:'',folders:[],funny:false};
function renderUpload(prefFolder){
  upState={tab:'direct',files:[],uploader:'',folders:prefFolder?[prefFolder]:[],funny:false};
  const today=new Date().toISOString().slice(0,10);
  app.innerHTML=`<h1 class="page-title">📤 Upload Yaadein</h1>
    <div class="page-sub">Apni yaadein yahan upload karo — phir doston ke saath dekho! 📤</div>
    <div class="secret-note">✨ Photos <b>full original quality</b> me save hongi — koi compression nahi!</div>
    <div class="up-card">
      <div class="tabs">
        <button class="tab on" id="tabDirect" onclick="upTab('direct')">📸 Photo / Chhota Video<br><small>(10MB photo · 100MB video tak)</small></button>
        <button class="tab" id="tabDrive" onclick="upTab('drive')">🎬 Bada Video<br><small>(100MB+ · Google Drive link)</small></button>
      </div>
      <div id="upDirect">
        <div class="field"><label>📁 Files chuno (ek saath kayi!)</label>
          <div class="drop" onclick="document.getElementById('fileInp').click()">
            <div style="font-size:2.2rem">📤</div>Click karke photos/videos select karo
            <input type="file" id="fileInp" multiple accept="image/*,video/*" onchange="filesChosen(this)">
          </div><div class="filelist" id="fileList"></div>
        </div>
      </div>
      <div id="upDrive" style="display:none">
        <div class="field"><label>🔗 Google Drive video link</label>
          <input type="text" id="driveLink" placeholder="Drive pe video upload karke, uska share link yahan paste karo">
          <div class="hint">Drive app me video pe <b>Share → link copy</b> karo. Link me <b>"Anyone with the link"</b> ON hona chahiye! 🔓</div>
        </div>
      </div>
      <div class="field"><label>👤 Tum kaun ho?</label><div class="chips" id="upChips">
        ${MEMBERS.map(m=>`<button class="chip uploader" data-u="${esc(m.name)}" onclick="pickUploader(this)">${m.emoji} ${esc(m.nick)}</button>`).join('')}
      </div></div>
      <div class="field"><label>✍️ Caption (optional)</label>
        <input type="text" id="upCaption" placeholder="Kuch likhna ho to... 😄" maxlength="200"></div>
      <div class="field"><label>📅 Date</label><input type="date" id="upDate" value="${today}"></div>
      <div class="field"><label>📁 Kin folders me dikhe?</label><div class="chips" id="folderChips">
        ${FOLDERS.map(f=>`<button class="chip ${upState.folders.includes(f.tag)?'on':''}" data-f="${f.tag}" onclick="toggleFolder(this)">${esc(f.label)}</button>`).join('')}
      </div><div class="hint">Ek photo kayi folders me dikh sakti hai — file duplicate nahi hogi! ✨</div></div>
      <div class="field"><label>🧳 Trip ka naam (optional)</label>
        <input type="text" id="upTrip" placeholder="jaise: Goa Trip, College Fest..."></div>
      <div class="field"><label class="chip" id="funnyChip" onclick="toggleFunny()" style="display:inline-block">😂 Funny moment hai!</label></div>
      <button class="btn primary" id="upBtn" style="width:100%;font-size:1.1rem;padding:14px" onclick="doUpload()">🚀 Upload Karo!</button>
      <div id="upStatus" style="margin-top:12px"></div>
    </div>`;
}
function upTab(t){
  upState.tab=t;
  $('#tabDirect').classList.toggle('on',t==='direct');
  $('#tabDrive').classList.toggle('on',t==='drive');
  $('#upDirect').style.display=t==='direct'?'':'none';
  $('#upDrive').style.display=t==='drive'?'':'none';
}
function filesChosen(inp){
  upState.files=[...inp.files];
  $('#fileList').innerHTML=upState.files.map((f,i)=>`
    <div class="filerow" id="fr${i}">📎 ${esc(f.name)} <span class="st">(${(f.size/1048576).toFixed(1)} MB)</span>
    <div class="bar"><i id="bar${i}"></i></div><div class="st" id="st${i}">Ready ✅</div></div>`).join('');
}
function pickUploader(el){
  document.querySelectorAll('#upChips .chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on'); upState.uploader=el.dataset.u;
}
function toggleFolder(el){
  el.classList.toggle('on');
  const t=el.dataset.f;
  upState.folders=el.classList.contains('on')?[...upState.folders,t]:upState.folders.filter(x=>x!==t);
}
function toggleFunny(){
  upState.funny=!upState.funny;
  $('#funnyChip').classList.toggle('on',upState.funny);
}
function collectTags(){
  const tags=[...upState.folders];
  const trip=$('#upTrip').value.trim();
  if(trip) tags.push('trip:'+trip);
  if(upState.funny) tags.push('funny');
  return tags;
}
function validateMeta(){
  if(!upState.uploader){ toast('Pehle batao tum kaun ho! 👤'); return false; }
  if(!upState.folders.length){ toast('Kam se kam ek folder select karo! 📁'); return false; }
  return true;
}
async function doUpload(){
  if(upState.tab==='drive') return doDriveUpload();
  if(!validateMeta()) return;
  if(!upState.files.length){ toast('Pehle files select karo! 📎'); return; }
  const btn=$('#upBtn'); btn.disabled=true;
  const tags=collectTags(), caption=$('#upCaption').value.trim(), date=$('#upDate').value||null;
  let ok=0,fail=0;
  for(let i=0;i<upState.files.length;i++){
    const f=upState.files[i], st=$(`#st${i}`), bar=$(`#bar${i}`);
    const isV=f.type.startsWith('video');
    const max=isV?100*1048576:10*1048576;
    if(f.size>max){ st.textContent=isV?'❌ 100MB se bada — Drive wala tab use karo!':'❌ 10MB se badi photo nahi hogi'; fail++; continue; }
    try{
      st.textContent='⏳ Uploading...';
      const j=await uploadToCloudinary(f,p=>{bar.style.width=p+'%';});
      st.textContent='💾 Saving...';
      await SB.insert({url:j.secure_url,public_id:j.public_id,delete_token:j.delete_token||null,
        type:isV?'video':'photo',caption:caption||null,uploader:upState.uploader,
        taken_date:date,tags,reactions:{laugh:0,love:0,fire:0},trashed:false});
      ITEMS=[]; st.textContent='✅ Ho gaya!'; ok++;
    }catch(e){ st.textContent='❌ Fail — dobara try karo'; fail++; }
  }
  btn.disabled=false;
  $('#upStatus').innerHTML=`<div class="secret-note">🎉 <b>${ok} upload</b> ho gaye!${fail?` ❌ ${fail} fail hue.`:''}</div>`;
  toast(ok?`🎉 ${ok} yaadein save ho gayin!`:'Kuch upload nahi hua 😅');
}
async function doDriveUpload(){
  if(!validateMeta()) return;
  const link=$('#driveLink').value.trim();
  const id=driveId(link);
  if(!id){ toast('Sahi Drive link paste karo! 🔗'); return; }
  const btn=$('#upBtn'); btn.disabled=true;
  $('#upStatus').innerHTML='<span class="spin"></span> Saving...';
  try{
    await SB.insert({url:link,public_id:null,delete_token:null,type:'video',
      caption:$('#upCaption').value.trim()||null,uploader:upState.uploader,
      taken_date:$('#upDate').value||null,tags:collectTags(),
      reactions:{laugh:0,love:0,fire:0},trashed:false});
    ITEMS=[];
    $('#upStatus').innerHTML='<div class="secret-note">🎉 <b>Video add ho gaya!</b> Videos page pe dikhega. 🍿</div>';
    $('#driveLink').value=''; toast('🎉 Video save ho gaya!');
  }catch(e){ $('#upStatus').innerHTML=''; toast('Oops, try again! 😅'); }
  btn.disabled=false;
}

/* ================= SECRET ADMIN PAGE ================= */
async function renderAdmin(){
  sessionStorage.setItem('lg_admin','1');
  app.innerHTML=`<h1 class="page-title">🛠️ Admin Panel</h1>
    <div class="page-sub">Sirf Danish ke liye! 🤫 Delete wala button ab photos/videos pe bhi dikhega.</div>
    <div class="secret-note">🗑️ <b>Trash:</b> delete ki hui cheezein yahan aati hain. <b>Restore</b> se wapas, <b>Permanent Delete</b> se hamesha ke liye jayegi.<br>
    <small>Note: Cloudinary se file turant tabhi hategi jab upload ke 10 min ke andar permanent delete ho — purani files ke liye Cloudinary Media Library se manually saaf kar dena.</small></div>
    <h2 style="margin:14px 0 10px">🗑️ Trash (<span id="trashCount">...</span>)</h2>
    <div id="trashList"><div class="empty"><span class="spin"></span> Loading...</div></div>`;
  try{
    const rows=await SB.trash();
    $('#trashCount').textContent=rows.length;
    $('#trashList').innerHTML=rows.length? rows.map(r=>`
      <div class="trashrow">
        ${r.type==='photo'?`<img src="${esc(r.url)}" alt="">`:`<div style="width:64px;height:64px;border-radius:12px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:#111">🎬</div>`}
        <div class="tmeta">${esc(r.caption)||'(bina caption)'}<small>👤 ${esc(r.uploader||'')} · 📅 ${fmtDate(r.taken_date||r.created_at)} · ${r.type}</small></div>
        <button class="btn green" style="padding:8px 12px;font-size:.85rem" onclick="restoreItem('${r.id}')">↩️ Restore</button>
        <button class="btn" style="padding:8px 12px;font-size:.85rem;background:var(--red);color:#fff" onclick="permDeleteById('${r.id}')">❌</button>
      </div>`).join('')
      :`<div class="empty"><span class="big">✨</span>Trash khaali hai — sab safe hai!</div>`;
    window._trashRows=Object.fromEntries(rows.map(r=>[r.id,r]));
  }catch(e){ $('#trashList').innerHTML=`<div class="empty"><span class="big">😅</span>Load nahi ho paya.</div>`; }
}
async function permDeleteById(id){
  const row=(window._trashRows||{})[id]||null;
  return permDelete(id,row);
}

/* ================= INIT ================= */
route();
</script>
