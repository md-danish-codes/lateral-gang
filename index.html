<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lateral Gang 🎉 | Yaadein, Masti, Dosti</title>
<meta name="description" content="Lateral Gang — 6 lateral-entry doston ki yaadon ka ghar. Photos, videos, trips aur funny moments, sab ek jagah!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff4d8d; --yellow:#ffd93d; --cyan:#4dd8ff; --purple:#9b5de5;
  --green:#5ee87a; --orange:#ff9f45; --red:#ff5d5d; --ink:#232323;
  --bg1:#fff7e6; --bg2:#ffe9f3; --bg3:#e6f4ff;
  --card:#ffffff; --radius:20px;
  --shadow:5px 5px 0 rgba(35,35,35,.9);
  --shadow-sm:3px 3px 0 rgba(35,35,35,.9);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Fredoka','Hind',system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3));
  background-attachment:fixed; min-height:100vh; padding-bottom:90px;
}
::selection{background:var(--yellow)}
a{color:inherit}
/* ---------- NAV ---------- */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:3px solid var(--ink);
}
.nav-inner{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:1.35rem;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:6px}
.logo .lg-badge{background:var(--ink);color:#fff;border-radius:12px;padding:2px 10px;font-size:.95rem}
.nav-links{display:flex;gap:8px;overflow-x:auto;margin-left:auto;padding:4px 2px;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  text-decoration:none;font-weight:600;font-size:.92rem;white-space:nowrap;
  padding:8px 14px;border-radius:999px;border:2.5px solid var(--ink);background:#fff;
  box-shadow:var(--shadow-sm);transition:transform .12s;
}
.nav-links a:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(35,35,35,.9)}
.nav-links a.active{background:var(--yellow)}
/* ---------- LAYOUT ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px}
.page-title{font-size:1.7rem;font-weight:700;margin:6px 0 2px}
.page-sub{opacity:.75;margin-bottom:16px;font-weight:500}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.btn{
  font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
  border:3px solid var(--ink);border-radius:14px;padding:10px 18px;background:#fff;
  box-shadow:var(--shadow-sm);transition:transform .12s;text-decoration:none;display:inline-block;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(35,35,35,.9)}
.btn.primary{background:var(--yellow)}
.btn.pink{background:var(--pink);color:#fff}
.btn.cyan{background:var(--cyan)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ---------- HERO ---------- */
.hero{
  background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:var(--shadow);
  padding:34px 22px;text-align:center;position:relative;overflow:hidden;margin-bottom:22px;
}
.hero::before{content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 12% 18%, var(--yellow) 0 46px, transparent 47px),
    radial-gradient(circle at 88% 12%, var(--pink) 0 38px, transparent 39px),
    radial-gradient(circle at 82% 88%, var(--cyan) 0 52px, transparent 53px),
    radial-gradient(circle at 8% 82%, var(--green) 0 34px, transparent 35px);
  opacity:.5;pointer-events:none}
.hero h1{font-size:2.4rem;font-weight:700;position:relative}
.hero h1 .stroke{background:linear-gradient(180deg,transparent 62%,var(--yellow) 62%)}
.tagline{font-family:'Hind',sans-serif;font-size:1.35rem;font-weight:700;color:var(--pink);margin:10px 0;position:relative}
.hero p{position:relative;font-weight:500;opacity:.85;max-width:560px;margin:0 auto 18px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative}
.stat{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--shadow-sm);padding:10px 20px;min-width:110px}
.stat b{font-size:1.5rem;display:block}
.stat span{font-size:.85rem;opacity:.7;font-weight:600}
/* ---------- GRID / CARDS ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.mcard{
  background:var(--card);border:3px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:transform .15s;position:relative;
}
.mcard:hover{transform:translateY(-3px)}
.mcard .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:linear-gradient(135deg,var(--bg2),var(--bg3))}
.mcard video.thumb{background:#111}
.mcard .meta{padding:10px 12px}
.mcard .cap{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .sub{font-size:.78rem;opacity:.65;font-weight:500;margin-top:2px}
.vid-badge{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-size:.75rem;font-weight:700;
  padding:4px 10px;border-radius:999px;border:2px solid #fff}
.del-btn{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border:2.5px solid var(--ink);
  border-radius:12px;font-weight:700;font-size:.8rem;padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 rgba(35,35,35,.9)}
.empty{
  text-align:center;padding:46px 20px;background:#fff;border:3px dashed var(--ink);border-radius:24px;font-weight:600;
}
.empty .big{font-size:2.6rem;display:block;margin-bottom:8px}
/* ---------- MEMBERS ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.member-card{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow-sm);
  padding:20px 12px;text-align:center;cursor:pointer;transition:transform .15s;text-decoration:none}
.member-card:hover{transform:translateY(-3px) rotate(-1deg)}
.avatar{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;color:#fff}
.member-card h3{font-size:1.05rem}
.member-card .nick{display:inline-block;margin-top:6px;background:var(--yellow);border:2.5px solid var(--ink);
  border-radius:999px;padding:2px 12px;font-weight:700;font-size:.85rem}
.member-card .count{font-size:.78rem;opacity:.6;font-weight:600;margin-top:6px;display:block}
/* ---------- BIRTHDAYS ---------- */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.bcard{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow-sm);
  padding:20px 12px;text-align:center;position:relative;overflow:hidden}
.bcard .cake{font-size:2.4rem}
.bcard h3{margin:8px 0 2px}
.bcard .date{font-weight:700;color:var(--pink)}
.bcard .countdown{display:inline-block;margin-top:8px;background:var(--cyan);border:2.5px solid var(--ink);
  border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700}
.bcard.soon{opacity:.75;background:repeating-linear-gradient(45deg,#fff,#fff 12px,#fdf3ff 12px,#fdf3ff 24px)}
/* ---------- TRIPS ---------- */
.trip-sec{margin-bottom:26px}
.trip-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.trip-head h2{font-size:1.3rem}
.trip-head .pill{background:var(--purple);color:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:3px 14px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow-sm)}
/* ---------- LIGHTBOX ---------- */
.lb{position:fixed;inset:0;z-index:100;background:rgba(20,20,30,.82);display:none;
  align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.lb.open{display:flex}
.lb-box{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:var(--shadow);
  max-width:640px;width:100%;max-height:92vh;overflow-y:auto;padding:16px;position:relative}
.lb-media{width:100%;border-radius:16px;border:2.5px solid var(--ink);max-height:52vh;object-fit:contain;background:#111;display:block}
.lb-close{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;border:2.5px solid var(--ink);
  width:38px;height:38px;border-radius:50%;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);z-index:2}
.lb-cap{font-weight:700;font-size:1.05rem;margin:12px 0 4px}
.lb-info{font-size:.85rem;opacity:.7;font-weight:500;margin-bottom:8px}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tag{background:var(--bg3);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700}
.reacts{display:flex;gap:10px;margin:12px 0}
.react{flex:1;border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:1.25rem;padding:8px;
  cursor:pointer;box-shadow:var(--shadow-sm);font-family:inherit;transition:transform .1s}
.react:active{transform:scale(.93)}
.react b{display:block;font-size:.85rem}
.react.done{background:var(--yellow)}
.lb-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
/* ---------- CARD FOOT (react + comment, har photo/video ke niche) ---------- */
.card-foot{display:flex;gap:6px;padding:0 10px 12px;flex-wrap:wrap}
.mini-react{flex:1;border:2.5px solid var(--ink);border-radius:12px;background:#fff;font-size:1rem;padding:6px 4px;cursor:pointer;box-shadow:2px 2px 0 rgba(35,35,35,.9);font-family:inherit}
.mini-react:active{transform:scale(.94)}
.mini-react.done{background:var(--yellow)}
.mini-react b{font-size:.8rem}
.mini-cmt{border:2.5px solid var(--ink);border-radius:12px;background:var(--bg3);font-size:.9rem;font-weight:700;padding:6px 12px;cursor:pointer;box-shadow:2px 2px 0 rgba(35,35,35,.9);font-family:inherit}
.new-pill{display:inline-block;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:.72rem;font-weight:700;margin-left:6px;vertical-align:2px}
.loadmore{width:100%;margin-top:12px}
/* ---------- COMMENTS ---------- */
.cmt-sec{margin-top:14px;border-top:3px dashed var(--ink);padding-top:12px}
.cmt-head{font-weight:700;font-size:1.05rem;margin-bottom:8px}
.cmt-row{background:#fffdf5;border:2.5px solid var(--ink);border-radius:14px;padding:9px 12px;margin-bottom:8px;font-size:.9rem}
.cmt-row b{font-weight:700}
.cmt-row small{opacity:.6;font-weight:500;display:block;margin-top:2px}
.cmt-row .cmt-del{float:right;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 9px;font-size:.75rem;font-weight:700;cursor:pointer}
.cmt-form{display:flex;gap:8px;margin-top:8px}
.cmt-form input{flex:1;font-family:inherit;font-size:.95rem;font-weight:500;padding:10px 13px;border:3px solid var(--ink);border-radius:14px;background:#fffdf5;outline:none}
.cmt-form .btn{padding:10px 16px}
/* ---------- UPLOAD ---------- */
.up-card{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.up-card h2{margin-bottom:4px}
.up-card .hint{font-size:.88rem;opacity:.7;font-weight:500;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:.95rem}
.field input[type=text],.field input[type=date],.field select{
  width:100%;font-family:inherit;font-size:1rem;font-weight:500;padding:11px 14px;
  border:3px solid var(--ink);border-radius:14px;background:#fffdf5;outline:none;
}
.field input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,77,141,.2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2.5px solid var(--ink);border-radius:999px;padding:7px 15px;font-weight:700;font-size:.88rem;
  background:#fff;cursor:pointer;box-shadow:2px 2px 0 rgba(35,35,35,.9);font-family:inherit;transition:transform .1s}
.chip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(35,35,35,.9)}
.chip.on{background:var(--green)}
.chip.uploader.on{background:var(--cyan)}
.drop{border:3px dashed var(--ink);border-radius:18px;padding:30px 16px;text-align:center;cursor:pointer;
  background:#fffdf5;font-weight:600;transition:background .15s}
.drop:hover{background:#fff3d6}
.drop input{display:none}
.filelist{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.filerow{background:#fffdf5;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:.88rem;font-weight:600}
.filerow .bar{height:10px;background:#eee;border:2px solid var(--ink);border-radius:99px;margin-top:8px;overflow:hidden}
.filerow .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .2s}
.filerow .st{font-size:.78rem;opacity:.7}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:11px;border:3px solid var(--ink);border-radius:14px;font-weight:700;cursor:pointer;background:#fff;box-shadow:var(--shadow-sm);font-family:inherit;font-size:.92rem}
.tab.on{background:var(--pink);color:#fff}
/* ---------- ADMIN ---------- */
.trashrow{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:10px;box-shadow:var(--shadow-sm);margin-bottom:10px}
.trashrow img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:2px solid var(--ink)}
.trashrow .tmeta{flex:1;font-size:.88rem;font-weight:600}
.trashrow .tmeta small{opacity:.6;font-weight:500;display:block}
/* ---------- TOAST ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);z-index:200;
  background:var(--ink);color:#fff;font-weight:700;padding:13px 24px;border-radius:999px;border:3px solid #fff;
  box-shadow:0 6px 24px rgba(0,0,0,.3);transition:transform .3s;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
/* ---------- MISC ---------- */
.secret-note{background:#fff8e1;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;font-weight:600;
  font-size:.9rem;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.kbd{background:var(--ink);color:#fff;border-radius:8px;padding:2px 10px;font-size:.85rem;font-weight:700}
footer{text-align:center;margin-top:34px;font-weight:600;opacity:.65;font-size:.88rem}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(0,0,0,.2);border-top-color:var(--ink);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- LOGIN GATE ---------- */
.gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:auto;background:linear-gradient(135deg,#7c5cff,#ff4d8d 55%,#ffb020)}
.gate-card{background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 rgba(35,35,35,.9);
  max-width:600px;width:100%;padding:30px 24px;text-align:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.gate-card h2{font-size:1.5rem;margin:10px 0 4px}
.gate-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
@media(min-width:520px){.gate-grid{grid-template-columns:repeat(3,1fr)}}
.gate-opt{border:2.5px solid var(--ink);border-radius:18px;padding:14px 8px;cursor:pointer;
  background:#fafafa;box-shadow:var(--shadow-sm);transition:transform .12s;font-family:inherit}
.gate-opt:hover{transform:translateY(-3px);background:#fff}
.gate-opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(35,35,35,.9)}
.gate-opt .ge{font-size:2rem}
.gate-opt b{display:block;font-size:1rem;margin-top:4px}
.gate-opt span{font-size:.82rem;opacity:.65;font-weight:600}
.who-chip{border-style:dashed!important;cursor:pointer}
/* ---------- ANIMATIONS ---------- */
.page-in{animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.page-in{animation:none}}
.mcard{transition:transform .18s,box-shadow .18s}
.mcard:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:7px 7px 0 rgba(35,35,35,.9)}
.member-card{transition:transform .18s,box-shadow .18s}
.member-card:hover{transform:translateY(-5px) scale(1.03);box-shadow:7px 7px 0 rgba(35,35,35,.9)}
.nav-links a{transition:transform .12s,background .15s}
.nav-links a:hover{transform:translateY(-2px)}
.gate-opt{transition:transform .15s,background .15s}
.btn{transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.mgrid.big{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.mgrid.big .avatar{width:84px;height:84px;font-size:2.6rem}
/* ---------- HAMBURGER DRAWER ---------- */
.ham{margin-left:8px;font-size:1.25rem;background:#fff;border:2.5px solid var(--ink);border-radius:12px;
  padding:6px 12px;cursor:pointer;box-shadow:var(--shadow-sm);font-family:inherit;flex-shrink:0}
.ham:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(35,35,35,.9)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:86vw;background:#fff;z-index:300;
  border-left:3px solid var(--ink);transform:translateX(105%);transition:transform .28s ease;
  display:flex;flex-direction:column;padding:20px 16px;box-shadow:-8px 0 24px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.drawer-ov{position:fixed;inset:0;background:rgba(35,35,35,.45);z-index:290;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-ov.show{opacity:1;pointer-events:auto}
.drawer-head{font-size:1.35rem;font-weight:700;margin-bottom:14px;text-align:center}
.drawer nav a{display:block;text-decoration:none;font-weight:600;padding:12px 14px;border-radius:14px;
  border:2.5px solid var(--ink);margin-bottom:8px;background:#fafafa;box-shadow:var(--shadow-sm)}
.drawer nav a:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(35,35,35,.9)}
.drawer-foot{margin-top:auto}
/* ---------- WELCOME OVERLAY ---------- */
.welcome-ov{position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(35,35,35,.35)}
.welcome-card{background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 rgba(35,35,35,.9);
  max-width:440px;width:100%;padding:36px 28px;text-align:center;animation:wpop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes wpop{from{transform:scale(.7);opacity:0}}
.welcome-msg{font-size:1.35rem;font-weight:700;margin-top:10px;line-height:1.55}
/* ---------- UPLOAD SUCCESS ---------- */
@keyframes succPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.succ-pop{animation:succPop .45s cubic-bezier(.2,1.4,.4,1)}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a class="logo" href="#/">🎉 <span class="lg-badge">Lateral Gang</span></a>
  <div class="nav-links" id="navLinks"></div>
  <button class="ham" onclick="toggleDrawer()" aria-label="Menu">☰</button>
</div></nav>
<div class="wrap" id="app"></div>
<div class="lb" id="lightbox"><div class="lb-box" id="lbBox"></div></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate" style="display:none"><div class="gate-card">
  <div style="font-size:3rem">🕵️</div>
  <h2>Ek baap ka hai to bata…</h2>
  <div class="page-sub" style="margin-bottom:0"><b>tu inme se kaun hai? 😎</b><br>Apna naam chune bina entry nahi milegi!</div>
  <div class="gate-grid" id="gateCards"></div>
</div></div>
<div class="welcome-ov" id="welcomeOv" style="display:none"><div class="welcome-card">
  <div style="font-size:3.5rem" id="welcomeEmoji">🎉</div>
  <div class="welcome-msg" id="welcomeMsg"></div>
  <div style="opacity:.55;font-size:.85rem;font-weight:600;margin-top:10px">Tap karke aage badho 👆</div>
</div></div>
<div class="drawer-ov" id="drawerOv" onclick="toggleDrawer(false)"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">🎉 Lateral Gang</div>
  <nav id="drawerLinks"></nav>
  <div class="drawer-foot">
    <button class="btn" style="width:100%;margin-bottom:8px" onclick="switchWho();toggleDrawer(false)">👤 Naam badlo</button>

function ac(){

  return AC;

function tone(f,d,type,v,delay){
  if(!SOUND) return;
  const c=ac(); if(!c) return;
  try{
    const t=c.currentTime+(delay||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v||.12,t+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+d+.05);
  }catch(e){}
}

/* ================= CLOUDINARY UPLOAD (with progress) ================= */
function uploadToCloudinary(file,onProgress){
  return new Promise((resolve,reject)=>{
    const resourceType = file.type.startsWith('video') ? 'video' : 'image';
    const fd=new FormData();
    fd.append('file',file);
    fd.append('upload_preset',CONFIG.uploadPreset);
    const xhr=new XMLHttpRequest();
    xhr.open('POST',`https://api.cloudinary.com/v1_1/${CONFIG.cloudName}/${resourceType}/upload`);
    xhr.upload.onprogress=e=>{ if(e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload=()=>{ try{ const j=JSON.parse(xhr.responseText); j.error?reject(new Error(j.error.message)):resolve(j); }catch(e){reject(e)} };
    xhr.onerror=()=>reject(new Error('network'));
    xhr.send(fd);
  });
}

async function sendComment(mediaId){

  const text=inp.value.trim().slice(0,200);

    r.reactions=u.reactions;

/* Browser me hi photo chhoti karo: max 1600px, ~1MB target. Date form se aati hai, EXIF par depend nahi, isliye date nahi bigdegi. Video compress nahi karte. */
function compressImage(file){
  return new Promise(resolve=>{
    if(!file.type.startsWith('image/') || file.size<=1048576){ resolve(file); return; }
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const scale=Math.min(1,1600/Math.max(img.width,img.height));
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=>{
        if(b && b.size<file.size) resolve(new File([b],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}));
        else resolve(file);
      },'image/jpeg',0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}

  const f=upState.files[i], st=$(`#st${i}`), bar=$(`#bar${i}`);
  const isV=f.type.startsWith('video');
  let upFile=f;
  if(!isV){
    st.textContent='🗜️ Compress ho rahi hai...';
    upFile=await compressImage(f);
    if(upFile!==f) st.textContent=`🗜️ ${(f.size/1048576).toFixed(1)}MB → ${(upFile.size/1048576).toFixed(1)}MB`;
  }
  const max=isV?100*1048576:10*1048576;
  if(upFile.size>max){ st.textContent=isV?'❌ 100MB se bada — Drive wala tab use karo!':'❌ Compress ke baad bhi 10MB se badi hai'; return false; }
  st.textContent='⏳ Uploading...';
  const j=await uploadToCloudinary(upFile,p=>{bar.style.width=p+'%';});
  st.textContent='💾 Saving...';
  await SB.insert({url:j.secure_url,public_id:j.public_id,delete_token:j.delete_token||null,
    type:isV?'video':'photo',caption:ctx.caption||null,uploader:upState.uploader,

}

  const btn=$('#upBtn'); btn.disabled=true;
  const ctx={tags:collectTags(), caption:$('#upCaption').value.trim(), date:$('#upDate').value||null};
  window._retryCtx=ctx;
  let ok=0,fail=0;
  for(let i=0;i<upState.files.length;i++){
    $('#upStatus').innerHTML=`<div class="secret-note">⏳ Uploading ${i+1}/${upState.files.length}...</div>`;
    try{ if(await uploadOneFile(i,ctx)) ok++; else fail++; }
    catch(e){
      const st=$(`#st${i}`);

      fail++;
    }
  }
  btn.disabled=false;
  $('#upStatus').innerHTML=`<div class="secret-note succ-pop">🎉 <b>${ok} upload</b> ho gaye!${fail?` ❌ ${fail} fail hue — unke neeche Retry dabao, poora batch dobara nahi chadhana padega.`:''}</div>`;
  if(ok) sfx.success();
  toast(ok?`🎉 ${ok} yaadein save ho gayin!`:'Kuch upload nahi hua 😅');
}
async function doDriveUpload(){
  if(!validateMeta()) return;
  const link=$('#driveLink').value.trim();
  const id=driveId(link);
  if(!id){ toast('Sahi Drive link paste karo! 🔗'); return; }
  const btn=$('#upBtn'); btn.disabled=true;
  $('#upStatus').innerHTML='<span class="spin"></span> Saving...';
  try{
    await SB.insert({url:link,public_id:null,delete_token:null,type:'video',
      caption:$('#upCaption').value.trim()||null,uploader:upState.uploader,
      taken_date:$('#upDate').value||null,tags:collectTags(),
      reactions:{laugh:0,love:0,fire:0},trashed:false});
    ITEMS=[];
    $('#upStatus').innerHTML='<div class="secret-note succ-pop">🎉 <b>Video add ho gaya!</b> Videos page pe dikhega. 🍿</div>';
    $('#driveLink').value=''; sfx.success(); toast('🎉 Video save ho gaya!');
  }catch(e){ $('#upStatus').innerHTML=''; toast('Oops, try again! 😅'); }
  btn.disabled=false;
}

/* ================= SECRET ADMIN PAGE ================= */
async function renderAdmin(){
  sessionStorage.setItem('lg_admin','1');
  app.innerHTML=`<h1 class="page-title">🛠️ Admin Panel</h1>
    <div class="page-sub">Sirf Danish ke liye! 🤫 Delete wala button ab photos/videos pe bhi dikhega.</div>
    <div class="secret-note">🗑️ <b>Trash:</b> delete ki hui cheezein yahan aati hain. <b>Restore</b> se wapas, <b>Permanent Delete</b> se hamesha ke liye jayegi.<br>
    <small>Note: Cloudinary se file turant tabhi hategi jab upload ke 10 min ke andar permanent delete ho — purani files ke liye Cloudinary Media Library se manually saaf kar dena.</small></div>
    <h2 style="margin:14px 0 10px">🗑️ Trash (<span id="trashCount">...</span>)</h2>
    <div id="trashList"><div class="empty"><span class="spin"></span> Loading...</div></div>
    <h2 style="margin:18px 0 10px">👀 Visit Log <small style="font-weight:500;opacity:.6">(kaun, kab aaya)</small></h2>
    <div id="visitLog"><div class="empty"><span class="spin"></span> Loading...</div></div>
    <div class="secret-note" style="margin-top:10px">📌 Ye log <b>sirf tum</b> dekh sakte ho. Pehli baar ke liye Supabase SQL editor me <b>visits</b> table banao — SQL maine de di hai!</div>`;
  try{
    const rows=await SB.trash();
    $('#trashCount').textContent=rows.length;
    $('#trashList').innerHTML=rows.length? rows.map(r=>`
      <div class="trashrow">
        ${r.type==='photo'?`<img src="${esc(r.url)}" alt="">`:`<div style="width:64px;height:64px;border-radius:12px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:#111">🎬</div>`}
        <div class="tmeta">${esc(r.caption)||'(bina caption)'}<small>👤 ${esc(r.uploader||'')} · 📅 ${fmtDate(r.taken_date||r.created_at)} · ${r.type}</small></div>
        <button class="btn green" style="padding:8px 12px;font-size:.85rem" onclick="restoreItem('${r.id}')">↩️ Restore</button>
        <button class="btn" style="padding:8px 12px;font-size:.85rem;background:var(--red);color:#fff" onclick="permDeleteById('${r.id}')">❌</button>
      </div>`).join('')
      :`<div class="empty"><span class="big">✨</span>Trash khaali hai — sab safe hai!</div>`;
    window._trashRows=Object.fromEntries(rows.map(r=>[r.id,r]));
  }catch(e){ $('#trashList').innerHTML=`<div class="empty"><span class="big">😅</span>Load nahi ho paya.</div>`; }
  loadVisits();
}
async function loadVisits(){
  const el=$('#visitLog'); if(!el) return;
  try{
    const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/visits?select=who,visited_at&order=visited_at.desc&limit=60`,{headers:SB.h()});
    if(!r.ok) throw 0;
    const rows=await r.json();
    el.innerHTML=rows.length? `<div class="mgrid">`+rows.map(v=>{
      const m=MEMBERS.find(x=>x.tag===v.who);
      const d=new Date(v.visited_at);
      const when=d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      return `<div class="mcard" style="cursor:default"><div style="font-size:2.2rem;text-align:center;padding-top:12px">${m?m.emoji:'👤'}</div>
        <div class="meta" style="text-align:center"><div class="cap">${esc(m?m.name+' ('+m.nick+')':v.who)}</div>
        <div class="sub">🕒 ${when}</div></div></div>`;
    }).join('')+`</div>`
    :`<div class="empty"><span class="big">👀</span>Abhi koi visit nahi hui.</div>`;
  }catch(e){
    el.innerHTML=`<div class="empty"><span class="big">🛠️</span>Visit log ke liye Supabase me <b>visits</b> table banana padegi.<br>SQL maine bhej di hai — ek baar chala do!</div>`;
  }
}
async function permDeleteById(id){
  const row=(window._trashRows||{})[id]||null;
  return permDelete(id,row);
}
